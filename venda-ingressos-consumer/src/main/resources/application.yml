server:
  port: 8081

spring:
  application:
    name: venda-ingressos-consumer
  datasource:
    url: jdbc:h2:file:./data/consumer-db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: venda-ingressos-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      # Lote pequeno para manter o ciclo de poll abaixo de max.poll.interval.ms: estourá-lo
      # faz o broker considerar o consumidor travado e rebalancear o grupo.
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer torna a falha de desserialização tratável pelo contêiner,
      # em vez de estourar dentro do poll e travar a partição.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: br.pucminas.aed.vendaingressosconsumer.domain.IngressoEmitidoEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: br.pucminas.aed.vendaingressosconsumer.domain
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual
      # Uma thread por partição: aqui o efeito é uma transação em banco por registro, então
      # paralelizar aumenta vazão. A ordem por eventoComercialId segue garantida.
      concurrency: 3

app:
  kafka:
    topico-ingresso-emitido: ingressos.ingresso-emitido.v1
    topico-ingresso-invalidado: ingressos.ingresso-invalidado.v1
    topico-ingresso-emitido-dlt: ingressos.ingresso-emitido.v1.dlt-consumer
    topico-ingresso-invalidado-dlt: ingressos.ingresso-invalidado.v1.dlt-consumer
